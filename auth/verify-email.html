<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styling -->
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/supabase.js"></script>

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 28px 16px;
        }

        .auth-box {
            width: 100%;
            max-width: 440px;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
            justify-content: center;
        }

        .auth-brand-logo {
            width: 42px;
            height: 42px;
            background: #fff !important;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .auth-brand-logo img {
            width: 30px;
            height: 30px;
            object-fit: cover;
        }

        .auth-brand-name {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .auth-brand-sub {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        /* ── State icon badge ── */
        .verify-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 24px;
            transition: var(--transition);
        }

        .verify-icon.loading {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .verify-icon.loading i {
            animation: verifySpin 1s linear infinite;
        }

        .verify-icon.success {
            background: var(--success-soft);
            color: var(--success);
        }

        .verify-icon.success i {
            animation: verifyPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .verify-icon.error {
            background: var(--danger-soft);
            color: var(--danger);
        }

        @keyframes verifySpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes verifyPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .auth-card h2 {
            font-size: 21px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 10px;
        }

        .auth-card p.subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .verify-btn {
            display: none;
        }

        .verify-btn.show {
            display: inline-flex;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 20px;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary);
        }

        .back-link i {
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="auth-page">
        <div class="auth-box">

            <!-- Brand -->
            <div class="auth-brand">
                <div class="auth-brand-logo">
                    <img src="../assets/images/logo.png" alt="Logo">
                </div>
                <div>
                    <div class="auth-brand-name">Inno-Chike</div>
                    <div class="auth-brand-sub">Inventory Management</div>
                </div>
            </div>

            <div class="auth-card">

                <div class="verify-icon loading" id="v-icon">
                    <i class="fa-solid fa-circle-notch" id="v-icon-inner"></i>
                </div>

                <h2 id="v-title">Verifying your email</h2>
                <p class="subtitle" id="v-message">This will only take a moment...</p>

                <a href="../index.html" class="btn btn-primary w-100 auth-submit verify-btn" id="v-btn"
                    style="text-decoration:none;">
                    <span id="v-btn-label">Go to Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <div id="v-back-row" style="display:none;">
                    <a href="../index.html" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Sign In
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script>
        (async function () {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get('token_hash');
            const type = params.get('type') || 'email';

            const icon = document.getElementById('v-icon');
            const iconInner = document.getElementById('v-icon-inner');
            const title = document.getElementById('v-title');
            const message = document.getElementById('v-message');
            const btn = document.getElementById('v-btn');
            const btnLabel = document.getElementById('v-btn-label');

            function setState(state, iconClass, titleText, messageText, btnText) {
                icon.className = 'verify-icon ' + state;
                iconInner.className = iconClass;
                title.textContent = titleText;
                message.textContent = messageText;
                btnLabel.textContent = btnText;
                btn.classList.add('show');
            }

            if (!token_hash) {
                setState(
                    'error',
                    'fa-solid fa-link-slash',
                    'Invalid verification link',
                    'This link is missing required information. Please use the link from your email exactly as sent, or request a new one.',
                    'Go to Sign In'
                );
                return;
            }

            const { error } = await db.auth.verifyOtp({ token_hash, type });

            if (error) {
                setState(
                    'error',
                    'fa-solid fa-triangle-exclamation',
                    'Verification failed',
                    'This link may have expired or already been used. Please try signing up again or contact an admin for help.',
                    'Go to Sign In'
                );
            } else {
                await db.auth.signOut();
                setState(
                    'success',
                    'fa-solid fa-check',
                    'Email verified!',
                    'Your email has been confirmed. You can now sign in — an admin will assign your role if they haven\'t already.',
                    'Continue to Sign In'
                );
                showToast('Email verified successfully.', 'success');
            }
        })();
    </script>

</body>

</html>
